<style>
/* Одна светлая «книжка-картинка»: пастельная сиреневая комната, карточки как страницы, крупные круглые кнопки */
:root{

  color-scheme:light;
}
*{box-sizing:border-box}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(180deg,var(--bg) 70%,transparent)}

.combo{display:flex;flex-direction:column;gap:6px}

.sol{font-variant-numeric:tabular-nums}
.ans{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--sun2);display:inline-block;padding:4px 12px;border-radius:12px;margin-top:6px}

.helper{display:flex;gap:12px;align-items:flex-start}

.ops{grid-template-columns:repeat(4,minmax(0,1fr))}

.op{background:var(--sun2);border-radius:20px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent}

.op.bad{background:#FFE9DF;opacity:.55}
.expr{font-family:var(--display);font-size:32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.box{min-width:78px;height:62px;border-radius:16px;border:3px solid var(--pink);background:#FFF5F9;display:inline-grid;place-items:center;padding:0 10px;font-family:var(--display);font-size:32px}
.box.act{box-shadow:0 0 0 5px var(--pink2)}
.box.ok{border-color:var(--mint);background:var(--mint2)}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.key{min-height:60px;border-radius:16px;background:var(--sky2);font-size:28px;font-family:var(--display);font-weight:700;box-shadow:0 3px 0 rgba(90,74,99,.15)}
.key:active{transform:translateY(2px)}
.key.ok{background:var(--pink);color:#fff;font-family:var(--body);font-size:22px;font-weight:900}
.key.del{background:#fff;font-size:16px}
.hintbox{margin-top:12px;background:var(--sun2);border-radius:18px;padding:12px 14px;font-size:19px}
.hintbox .model svg{max-width:360px}
.fb{margin-top:10px;font-size:19px;border-radius:16px;padding:10px 14px}
.fb.no{background:#FFF0E8}
.fb.yes{background:var(--mint2)}
.helpbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fb.top{margin:0 0 8px;font-size:17px;padding:6px 12px}
@media (max-width:560px){.helper{flex-direction:column;gap:6px}.helper .ava{width:64px;margin-left:14px}.helper .ava svg{width:64px}.bubble::before{left:34px;top:-10px;border:10px solid transparent;border-bottom-color:var(--card);border-top:0}.keypad{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* магазин */
.shopgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 4px 0 rgba(90,74,99,.08);border:3px solid transparent}
.item.on{border-color:var(--mint)}
.item svg.ic{width:96px;height:96px}
.item .nm{font-size:16px;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.item .btn{width:100%;min-height:46px;font-size:16px;padding:6px 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;background:#fff;font-size:17px;font-weight:800}
.tab.on{background:var(--ink);color:#fff}

/* окна */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(74,59,92,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--card);border-radius:30px;padding:22px;max-width:620px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal.center{align-items:center;text-align:center}
.modal h2{font-size:26px}
.modal p,.modal li{font-size:18px;font-weight:600;line-height:1.5}
.modal ul,.modal ol{margin:0;padding-left:22px}
.reward svg.cat{width:170px;height:auto;animation:hop .7s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-14px) rotate(-3deg)}}
.big{font-family:var(--display);font-size:38px;color:var(--pink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;z-index:60;font-size:17px;max-width:calc(100% - 32px)}
.confetti{position:fixed;top:-40px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- котики ----------

const CATS={
  ginger:{label:'Рыжий',fur:'#FFC27A',hi:'#FFE6C2',dark:'#EE9748',belly:'#FFF3E2',ear:'#FFB0C0',iris:'#A6E0A0',iris2:'#3E9B57',pat:'tabby'},
  grey:{label:'Серый полосатый',fur:'#C5CCD8',hi:'#EEF1F6',dark:'#8C96AA',belly:'#F6F7FB',ear:'#FFC0CE',iris:'#FBE08A',iris2:'#D0961C',pat:'tabby'},
  white:{label:'Белый пушистый',fur:'#FFFFFF',hi:'#FFFFFF',dark:'#E7DDF3',belly:'#FFFFFF',ear:'#FFBFCD',iris:'#B9DDFB',iris2:'#4C8FD6',pat:'none'},

};

  if(st.op==='−'){const bt=b-b%10,bo=b%10;return b<10?[`Отсчитай назад от ${a} ровно ${b}.`,`${a} − ${b}: сначала вычти до круглого числа, потом остальное.`,`Ответ чуть меньше, чем ${a}.`]:[`Сначала вычти десятки, потом единицы.`,`${a} − ${b} = ${a} − ${bt}${bo?` − ${bo}`:''}`,`${a} − ${bt} = ${a-bt}${bo?`. Осталось вычесть ${bo}.`:'.'}`];}
  if(st.op==='·')return['Умножить — значит сложить одинаковые числа.',`${a} · ${b} = ${Array(b).fill(a).join(' + ')}`,`${a} · ${b-1} = ${a*(b-1)}. Прибавь ещё ${a}.`];
  if(st.rem!==undefined){const rows=[];for(let i=1;i<=9&&b*i<=a+b;i++)rows.push(`<span style="white-space:nowrap">${b} · ${i} = ${b*i}</span>`);return[`Найди самое большое число, которое можно умножить на ${b}, чтобы получилось не больше ${a}.`,`Посмотри на таблицу: ${rows.join(', ')}. Какое число самое близкое к ${a}, но не больше?`,`${b} · ${st.res} = ${b*st.res}. А сколько осталось до ${a}?`];}
  const rows=[];for(let i=1;i<=st.res;i++)rows.push(`${b} · ${i} = ${b*i}`);return[`Разделить — значит найти число, которое при умножении на ${b} даст ${a}.`,`${b} · ? = ${a}`,`Посмотри: ${rows.slice(-3).join(', ')}.`];}
function checkHints(){const c=T.check;return['Проверка — это обратное действие. Если ответ верный, получится число из условия.',`Посчитай по шагам: ${c.expr}.`,`Должно получиться ${c.val}. Посчитай и убедись!`];}

function renderPlay(){
  const si=stepIndex();
  app.innerHTML=topbar(`Уровень ${T.level}`,true)+`<div class="card pop"><div class="taskhead"><span class="tag">${LV[T.level].t.toUpperCase()}</span><button class="btn small sky" data-act="read">Прочитай мне</button></div><div class="task">${taskHTML()}</div></div>
  <div class="steps" aria-label="шаги">${STEPNAMES.map((n,i)=>`<span class="${i===si?'on':i<si?'done':''}">${i+1}. ${n}</span>`).join('')}</div>
  ${notebook()}${stepPanel()}`;
}
function scrollStep(){const el=document.getElementById('stepPanel');if(el&&el.scrollIntoView){try{el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}catch(e){}}}
function nextPhase(ph){P.phase=ph;P.hint=0;P.bad=[];P.input=['',''];P.active=0;renderPlay();scrollStep();}
const SOFT=['Почти! Давай подумаем ещё.','Не страшно, попробуем ещё раз.','Хм, не то. Котик тоже иногда путается!','Ошибка — это подсказка, куда смотреть. Ещё разок!'];
function wrong(t){P.mistakes++;P.fb={ok:false,t:t||pick(SOFT)};}

function onRQ(i){if(P.phase!=='read')return;const Q=T.rq[P.rqi];
  if(i===Q.ok){P.readAns.push(Q.opts[i]);P.rqi++;
    if(P.rqi>=T.rq.length){P.fb={ok:true,t:'Ты поняла задачу! Теперь найдём в ней числа.'};nextPhase('nums');}
    else{P.fb={ok:true,t:'Верно! Ещё один вопрос.'};P.hint=0;P.bad=[];renderPlay();scrollStep();}}
  else{P.bad.push(i);wrong('Не совсем так. Прочитай задачу ещё раз — можно нажать «Прочитай мне».');renderPlay();}}
function onNum(i){if(P.phase!=='nums'||P.found.includes(i))return;P.found.push(i);P.fb=null;if(P.found.length===T.known.length){P.fb={ok:true,t:'Все числа найдены! Они уже в блокноте.'};nextPhase('find');}else renderPlay();}
function onQ(i){const ok=T.qOpts[i]===plain(T.ask);if(ok){P.fb={ok:true,t:'Верно! Это и есть вопрос задачи.'};nextPhase('scheme');}else{P.bad.push(i);wrong('Это мы уже знаем из условия. А что спрашивают? Посмотри на предложение со знаком «?».');renderPlay();}}
function onScheme(i){const ok=T.schemeOpts[i]===T.scheme;if(ok){P.fb={ok:true,t:'Да! Схема готова — она в блокноте. Посмотри на неё: где знак «?»?'};nextPhase('op');}else{P.bad.push(i);wrong('Эта схема про другое. Подумай: '+(SHINT[T.scheme.split('>')[0]]||''));renderPlay();}}
function onOp(o){const st=T.steps[P.si];if(o===st.op){P.fb={ok:true,t:'Правильно выбрано действие!'};nextPhase('calc');}else{P.bad.push(o);const more=st.res>st.a;wrong(`Подумай: ответ должен получиться больше, чем ${st.a}, или меньше? ${st.op===':'||st.op==='·'?'И есть ли тут одинаковые группы?':''}`.trim());renderPlay();}}
function onKey(k){
  if(k==='ok')return submitCalc();
  const i=P.active;if(k==='del')P.input[i]=P.input[i].slice(0,-1);else if(P.input[i].length<3)P.input[i]=(P.input[i]==='0'?'':P.input[i])+k;
  const st=T.steps[P.si];if(P.phase==='calc'&&st&&st.rem!==undefined&&i===0&&P.input[0].length>=String(st.res).length&&k!=='del')P.active=1;
  renderPlay();
}
function submitCalc(){
  if(P.phase==='calc'){const st=T.steps[P.si];const v=parseInt(P.input[0],10),r=parseInt(P.input[1],10);
    if(isNaN(v)||(st.rem!==undefined&&isNaN(r))){P.fb={ok:false,t:st.rem!==undefined?'Впиши и ответ, и остаток (если ничего не осталось — 0).':'Впиши ответ кнопками с цифрами.'};renderPlay();return;}
    if(v===st.res&&(st.rem===undefined||r===st.rem)){
      const line=`${P.si+1}) ${st.a} ${st.op} ${st.b} = ${st.res}${st.rem!==undefined?` (ост. ${st.rem})`:''} (${st.unit}${st.rem!==undefined?`, ост. ${st.remUnit}`:''}) — ${st.label}`;
      P.lines.push(T.steps.length>1?line:line.replace(/^1\) /,''));
      P.fb={ok:true,t:'Верно посчитано!'};
      if(P.si+1<T.steps.length){P.si++;nextPhase('op');}else nextPhase('check');
    }else{P.calcMistakes++;let t=pick(SOFT);
      if(st.rem!==undefined&&v===st.res)t='Сколько помещается — верно! А остаток проверь: сколько не хватило до '+st.a+'?';
      else if(st.rem!==undefined&&r>=st.b)t=`Остаток должен быть меньше ${st.b}. Если осталось ${st.b} или больше — значит, поместится ещё раз!`;
      wrong(t);if(P.calcMistakes>=2&&P.hint<1)P.hint=1;P.input=['',''];P.active=0;renderPlay();}
    return;}
  if(P.phase==='check'){const v=parseInt(P.input[0],10);if(isNaN(v)){P.fb={ok:false,t:'Впиши, что получилось.'};renderPlay();return;}
    if(v===T.check.val){finish();}else{wrong(`Получилось не ${v}. Посчитай ещё раз по шагам — должно выйти число из условия.`);if(P.hint<1)P.hint=1;P.input=['',''];renderPlay();}}
}
const PRAISE=['Ты разобралась с задачей шаг за шагом — так и решают настоящие математики!','Числа найдены, вопрос найден, схема нарисована. Вот это работа!','Ты проверила ответ — значит, точно знаешь, что он верный.','Схема помогла увидеть задачу. Отличный ход!','Задача решена! Мозг стал чуточку сильнее.'];
function finish(){
  P.phase='done';const clean=P.calcMistakes===0;const lv=T.level;const gain=3+(P.mistakes===0?2:0);
  S.fish+=gain;S.total++;S.solved[lv]=(S.solved[lv]||0)+1;S.streak[lv]=clean?(S.streak[lv]||0)+1:Math.max(0,(S.streak[lv]||0)-1);
  let unlocked=false;if(S.streak[lv]>=GOAL&&lv===S.unlocked&&lv<6){S.unlocked++;unlocked=true;}save();
  renderPlay();chime();confetti();
  layer.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Задача решена"><div class="modal center reward pop">${catSVG(S.cat,{wear:S.wear,mood:'happy'},'cat')}
  <h2>Ура! Задача решена!</h2><div class="big">+${gain} ${pw(gain,'fish')}</div>
  <p style="margin:0">${esc(T.sense)}</p><p style="margin:0">${P.mistakes===0?pick(PRAISE):'Было непросто, но ты справилась. Ошибки помогают учиться — без них никак!'}</p>
  ${unlocked?`<p style="margin:0;background:var(--sun2);padding:10px 14px;border-radius:16px">Открыт новый уровень: «${LV[lv+1].t}»!</p>`:''}
  <div class="row" style="justify-content:center"><button class="btn main" data-act="again">Ещё задачку</button>${unlocked?`<button class="btn sun" data-act="nextlvl">На новый уровень</button>`:''}<button class="btn mint" data-act="shop">К котику</button></div></div></div>`;
}

function parents(){
  layer.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Для взрослых"><div class="modal">
  <h2>Для взрослых</h2>
  <p>Игра учит не считать быстрее, а понимать задачу. Каждая задача решается в шесть шагов: понять текст (про кого задача и как пересказать её своими словами), найти числа (что известно), выбрать вопрос (что найти), выбрать схему, выбрать действие и посчитать, проверить ответ обратным действием.</p>
  <p>Первый шаг сделан специально для детей, которые читают бегло, но не понимают прочитанного: пока ребёнок не ответил, про кого задача и что в ней спрашивают, считать игра не даёт. Слова-подсказки («по», «каждый», «остальные», «осталось», «таких же», «поровну», «на … больше») подчёркнуты волной и объяснены в блокноте. Порядок шагов и записи (краткая запись, схема, таблица «Цена · Количество · Стоимость», решение по действиям, «Ответ:», «ост.») совпадает с тем, как учат по учебнику Моро («Школа России»).</p>
  <ul><li>10–15 минут в день достаточно. Лучше 3 задачи с удовольствием, чем 10 через слёзы.</li>
  <li>Сидите рядом первые дни. Просите ребёнка пересказать задачу своими словами и показать на схеме, где «?».</li>
  <li>Подсказки идут ступеньками: сначала вопрос, потом рисунок, потом половина решения. Пользоваться ими можно и нужно — рыбки за это не отнимаются.</li>
  <li>Ошибка никогда не наказывается. За задачу без ошибок котик получает 5 рыбок, с ошибками — 3.</li>
  <li>Новый уровень открывается после ${GOAL} задач подряд, посчитанных без ошибок. Ошибка в счёте убирает один кружочек, а не все.</li>
  <li>Уровни: 1 — сложение и вычитание; 2 — «больше на / меньше на»; 3 — умножение и деление как равные группы; 4 — цена, количество, стоимость; 5 — задачи в два действия (как про стулья); 6 — деление с остатком (как про карандаши).</li>
  <li>«Прочитай мне» использует голос браузера. Если русского голоса нет, прочитайте задачу вслух сами.</li>
  <li>Прогресс хранится только в этом браузере на этом устройстве.</li></ul>
  <div class="row"><button class="btn sky small" data-act="unlockall">Открыть все уровни</button><button class="btn small" data-act="changecat">Сменить котика</button><button class="btn small" data-act="reset1">Начать заново</button></div>
  <div id="resetBox" hidden class="hintbox">Стереть всё: котика, рыбки и уровни? <div class="row" style="margin-top:8px"><button class="btn small main" data-act="reset2">Да, стереть</button><button class="btn small" data-act="resetNo">Нет</button></div></div>
  <button class="btn main" data-act="close">Закрыть</button></div></div>`;
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.cat){setupCat=d.cat;const v=(document.getElementById('catname')||{}).value;if(v!==undefined)S.name=v;renderSetup();return;}
  if(d.nm){const inp=document.getElementById('catname');if(inp)inp.value=d.nm;return;}
  if(d.lvl){const l=+d.lvl;if(l>S.unlocked){toast('Этот уровень пока закрыт. Реши ещё задачки на уровне '+S.unlocked+'!');return;}newTask(l);return;}
  if(d.tab){shopTab=d.tab;renderShop();return;}
  if(d.buy){const it=IT[d.buy];if(S.fish>=it.p&&!S.owned.includes(d.buy)){S.fish-=it.p;S.owned.push(d.buy);if(!isOn(d.buy))toggle(d.buy);save();chime();toast(`${it.n} — теперь у котика!`);}renderShop();return;}
  if(d.tog){toggle(d.tog);renderShop();return;}
  if(d.rq!==undefined){onRQ(+d.rq);return;}
  if(d.num!==undefined){onNum(+d.num);return;}
  if(d.q!==undefined){onQ(+d.q);return;}
  if(d.sc!==undefined){onScheme(+d.sc);return;}
  if(d.op){onOp(d.op);return;}
  if(d.key){onKey(d.key);return;}
  if(d.box!==undefined){P.active=+d.box;renderPlay();return;}
  const a=d.act;if(!a)return;
  if(a==='home'){layer.innerHTML='';go('home');}
  else if(a==='shop'){layer.innerHTML='';go('shop');}
  else if(a==='parents')parents();
  else if(a==='close'||a==='resetNo'){if(a==='resetNo'){document.getElementById('resetBox').hidden=true;}else layer.innerHTML='';}
  else if(a==='startgame'){const v=(document.getElementById('catname').value||'').trim();S.cat=setupCat;S.name=v||'Мурзик';save();go('home');}
  else if(a==='again'){layer.innerHTML='';newTask(T.level);}
  else if(a==='nextlvl'){layer.innerHTML='';newTask(T.level+1);}
  else if(a==='read')speak(T.text);
  else if(a==='sayStep'){const el=document.querySelector('.bubble .say');const h=document.querySelector('.hintbox');speak((el?el.textContent:'')+' '+(h?h.textContent:''));}
  else if(a==='hint'){if(P.phase==='nums'&&P.hint===2){const i=T.known.findIndex((_,j)=>!P.found.includes(j));P.hint=3;if(i>=0){onNum(i);return;}}
    if(P.phase==='read'&&P.hint===2){const Q=T.rq[P.rqi];const i=Q.opts.findIndex((q,j)=>j!==Q.ok&&!P.bad.includes(j));if(i>=0)P.bad.push(i);}
    if(P.phase==='find'&&P.hint===2){const i=T.qOpts.findIndex((q,j)=>q!==plain(T.ask)&&!P.bad.includes(j));if(i>=0)P.bad.push(i);}
    if(P.phase==='scheme'&&P.hint===2){const i=T.schemeOpts.findIndex((q,j)=>q!==T.scheme&&!P.bad.includes(j));if(i>=0)P.bad.push(i);}
    P.hint++;if(P.fb&&P.fb.ok)P.fb=null;renderPlay();scrollStep();}
  else if(a==='unlockall'){S.unlocked=6;save();layer.innerHTML='';toast('Все уровни открыты.');render();}
  else if(a==='changecat'){layer.innerHTML='';setupCat=S.cat||'ginger';S.cat=null;save();render();}
  else if(a==='reset1'){document.getElementById('resetBox').hidden=false;}
  else if(a==='reset2'){S=DEF();save();layer.innerHTML='';setupCat='ginger';render();}
});
document.addEventListener('input',e=>{if(e.target.id==='catname')S.name=e.target.value;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&layer.innerHTML){layer.innerHTML='';return;}
  if(screen!=='play'||!P||(P.phase!=='calc'&&P.phase!=='check')||layer.innerHTML)return;
  if(/^[0-9]$/.test(e.key)){onKey(e.key);e.preventDefault();}else if(e.key==='Backspace'){onKey('del');e.preventDefault();}else if(e.key==='Enter'){onKey('ok');e.preventDefault();}
});
window.__kotiki={GEN,makeTask,evalExpr,plural,state:()=>S,task:()=>T,prog:()=>P,newTask};
render();
})();
</script>
